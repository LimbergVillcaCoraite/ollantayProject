events {}
http {
  sendfile on;
  
  # MIME types
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream frontend {
    server ollantay_frontend:3000;
  }
  upstream persona {
    server persona_service:8002;
  }
  upstream tipos {
    server tipo_persona_service:8001;
  }
  upstream prestamos {
    server prestamo_service:8003;
  }

  server {
    listen 80;
    server_name _;

    # Frontend (Vite dev server or built app)
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 86400;
    }

    # Vite HMR WebSocket
    location /vite-hmr {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # APIs proxy
    location /api/personas/ {
      proxy_pass http://persona/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/tipos/ {
      proxy_pass http://tipos/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/prestamos/ {
      proxy_pass http://prestamos/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
