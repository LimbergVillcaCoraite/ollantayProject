events {}
http {
  sendfile on;
  # Resolve Docker DNS names dynamically so upstream IP changes don't cause 502s
  resolver 127.0.0.11 ipv6=off valid=10s;
  
  # Timeouts
  proxy_connect_timeout 300s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
  
  # MIME types
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream frontend {
    zone frontend 64k;
    server ollantay_frontend:3000 resolve;
  }
  upstream persona_service {
    zone persona_service 64k;
    server persona_service:8002 resolve;
  }
  upstream tipos {
    zone tipos 64k;
    server tipo_persona_service:8001 resolve;
  }
  upstream prestamos {
    zone prestamos 64k;
    server prestamo_service:8003 resolve;
  }
  upstream backend_root {
    zone backend_root 64k;
    server ollantay_backend:8000 resolve;
  }
  upstream ventas {
    zone ventas 64k;
    server venta_service:8004 resolve;
  }
  upstream compras {
    zone compras 64k;
    server compra_service:8005 resolve;
  }
  upstream proveedores {
    zone proveedores 64k;
    server proveedores_service:8006 resolve;
  }
  upstream cuentas {
    zone cuentas 64k;
    server cuentas_service:8007 resolve;
  }
  upstream rutas {
    zone rutas 64k;
    server rutas_service:8008 resolve;
  }
  upstream entregas {
    zone entregas 64k;
    server entregas_service:8000 resolve;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # Frontend (Vite dev server or built app)
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 86400;
    }

    # Vite HMR WebSocket
    location /vite-hmr {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # APIs proxy (CORS handled by FastAPI services)
    location /api/personas/ {
      proxy_pass http://persona_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Static uploads (proxied from persona_service)
    location /api/personas/uploads/ {
      proxy_pass http://persona_service/uploads/;
      proxy_set_header Host $host;
    }
    location /api/tipos/ {
      proxy_pass http://tipos/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/prestamos/ {
      proxy_pass http://prestamos/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Static uploads (proxied from prestamo_service for productos)
    location /api/prestamos/uploads/ {
      proxy_pass http://prestamos/uploads/;
      proxy_set_header Host $host;
    }

    # Nuevos upstreams
    location /api/reportes {
      proxy_pass http://backend_root/reportes;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Special endpoint not under /compras path in the service
    location = /api/compras/tipos-pago {
      proxy_pass http://compras/tipos-pago;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
    }
    # Static uploads for compras (comprobantes)
    location /api/compras/uploads/ {
      proxy_pass http://compras/uploads/;
      proxy_set_header Host $host;
    }
    location /api/compras {
      rewrite ^/api/compras/?$ /compras break;
      rewrite ^/api/compras/(.*)$ /compras/$1 break;
      proxy_pass http://compras;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
    }
    location /api/proveedores {
      rewrite ^/api/proveedores/?$ /proveedores break;
      rewrite ^/api/proveedores/(.*)$ /proveedores/$1 break;
      proxy_pass http://proveedores;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Ventas - endpoints auxiliares primero (sin rewrite)
    location = /api/ventas/tipos-venta {
      proxy_pass http://ventas/tipos-venta;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/ventas/tipos-pago {
      proxy_pass http://ventas/tipos-pago;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/ventas/health {
      proxy_pass http://ventas/health;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ventas/ {
      proxy_pass http://ventas/ventas/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ventas {
      proxy_pass http://ventas/ventas;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/cuentas {
      rewrite ^/api/cuentas/?$ /cuentas break;
      rewrite ^/api/cuentas/(.*)$ /cuentas/$1 break;
      proxy_pass http://cuentas;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/rutas/ {
      proxy_pass http://rutas/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/entregas/ {
      proxy_pass http://entregas/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
