events {}
http {
  sendfile on;
  # Resolve Docker DNS names dynamically so upstream IP changes don't cause 502s
  resolver 127.0.0.11 ipv6=off valid=10s;
  
  # Timeouts
  proxy_connect_timeout 300s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
  
  # MIME types
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream frontend {
    zone frontend 64k;
    server ollantay_frontend:3000 resolve;
  }
  upstream persona_service {
    zone persona_service 64k;
    server persona_service:8002 resolve;
  }
  upstream tipos {
    zone tipos 64k;
    server tipo_persona_service:8001 resolve;
  }
  upstream prestamos {
    zone prestamos 64k;
    server prestamo_service:8003 resolve;
  }
  upstream backend_root {
    zone backend_root 64k;
    server ollantay_backend:8000 resolve;
  }
  upstream ventas {
    zone ventas 64k;
    server venta_service:8004 resolve;
  }
  upstream compras {
    zone compras 64k;
    server compra_service:8005 resolve;
  }
  upstream proveedores {
    zone proveedores 64k;
    server proveedores_service:8006 resolve;
  }
  upstream cuentas {
    zone cuentas 64k;
    server cuentas_service:8007 resolve;
  }
  upstream rutas {
    zone rutas 64k;
    server rutas_service:8008 resolve;
  }
  upstream entregas {
    zone entregas 64k;
    server entregas_service:8000 resolve;
  }
  upstream ai {
    zone ai 64k;
    server ai_service:8010 resolve;
  }
  upstream gastos {
    zone gastos 64k;
    server gastos_service:8011 resolve;
  }

  server {
    listen 80;
    server_name archsoft-system.duck.dns.org _;
    client_max_body_size 10M;

    # Redirect everything else to HTTPS except ACME path
    location /.well-known/acme-challenge/ {
      alias /var/www/certbot/.well-known/acme-challenge/;
      allow all;
    }

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    location / {
      return 301 https://$host$request_uri;
    }

    # Serve development certificates for device installation (HTTP)
    location /certs/ {
      alias /etc/nginx/certs/;
      autoindex on;
      add_header Cache-Control "no-store";
    }

    # Vite HMR WebSocket
    location /vite-hmr {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # ACME challenge for Let's Encrypt (HTTP-01) - handled above

    # APIs proxy (CORS handled by FastAPI services)
    location /api/ai/ {
      proxy_pass http://ai/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/personas/ {
      proxy_pass http://persona_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # WebSocket para ubicaciones en tiempo real de personas
    location /api/personas/ws/ {
      proxy_pass http://persona_service/ws/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }
    # Static uploads (proxied from persona_service)
    location /api/personas/uploads/ {
      proxy_pass http://persona_service/uploads/;
      proxy_set_header Host $host;
    }
    location /api/tipos/ {
      proxy_pass http://tipos/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/prestamos/ {
      proxy_pass http://prestamos/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Static uploads (proxied from prestamo_service for productos)
    location /api/prestamos/uploads/ {
      proxy_pass http://prestamos/uploads/;
      proxy_set_header Host $host;
    }

    # Nuevos upstreams
    location /api/reportes {
      proxy_pass http://backend_root/reportes;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Special endpoint not under /compras path in the service
    location = /api/compras/tipos-pago {
      proxy_pass http://compras/tipos-pago;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
    }
    # Static uploads for compras (comprobantes)
    location /api/compras/uploads/ {
      proxy_pass http://compras/uploads/;
      proxy_set_header Host $host;
    }
    location /api/compras {
      rewrite ^/api/compras/?$ /compras break;
      rewrite ^/api/compras/(.*)$ /compras/$1 break;
      proxy_pass http://compras;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
    }
    location /api/proveedores {
      rewrite ^/api/proveedores/?$ /proveedores break;
      rewrite ^/api/proveedores/(.*)$ /proveedores/$1 break;
      proxy_pass http://proveedores;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Ventas - endpoints auxiliares primero (sin rewrite)
    location = /api/ventas/tipos-venta {
      proxy_pass http://ventas/tipos-venta;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/ventas/tipos-pago {
      proxy_pass http://ventas/tipos-pago;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/ventas/health {
      proxy_pass http://ventas/health;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/ventas/creditos {
      proxy_pass http://ventas/ventas/creditos;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/ventas/creditos-list {
      proxy_pass http://ventas/ventas/creditos-list;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/mis-deudas {
      proxy_pass http://ventas/mis-deudas;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Ventas - main routes (rewrite /api/ventas -> /ventas)
    location /api/ventas {
      rewrite ^/api/ventas/?$ /ventas break;
      rewrite ^/api/ventas/(.*)$ /ventas/$1 break;
      proxy_pass http://ventas;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/cuentas {
      rewrite ^/api/cuentas/?$ /cuentas break;
      rewrite ^/api/cuentas/(.*)$ /cuentas/$1 break;
      proxy_pass http://cuentas;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/rutas/ {
      proxy_pass http://rutas/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/entregas/ {
      proxy_pass http://entregas/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # WebSocket para tracking de entregas
    location /api/entregas/ws/ {
      proxy_pass http://entregas/ws/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }
  }

  # HTTPS server for secure context (required for mobile geolocation prompts)
  server {
    listen 443 ssl;
    http2 on;
    server_name archsoft-system.duck.dns.org _;
    client_max_body_size 10M;
    # --- SSL Certificates ---
    # Use Let's Encrypt certificates if present. Dev self-signed cert kept for fallback/manual testing.
    # Comment OUT the dev certificate lines after successful issuance.
    # Prod (Let's Encrypt) expected paths:
  # Use dev certificates for now to avoid startup failure if Let's Encrypt files are missing.
  # Uncomment LE lines once certs are issued, and comment the dev lines below.
  # ssl_certificate /etc/letsencrypt/live/archsoft-system.duck.dns.org/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/archsoft-system.duck.dns.org/privkey.pem;
  ssl_certificate     /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;
    # ACME challenge (if needed over HTTPS)
    location /.well-known/acme-challenge/ {
      alias /var/www/certbot/.well-known/acme-challenge/;
      allow all;
    }
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  # --- Security Headers ---
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  # Allow inline for existing legacy scripts/styles; tighten later.
  add_header Content-Security-Policy "default-src 'self' data: blob: https: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob: https:; script-src 'self' https: 'unsafe-inline' 'unsafe-eval'; style-src 'self' https: 'unsafe-inline'; font-src 'self' data: https:; connect-src 'self' https: wss: ws:;" always;
  # Geolocation needed for delivery tracking; other features disabled.
  add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
  # Avoid COOP/COEP/CORP to prevent blocking third-party resources (e.g., map tiles) unless all services emit proper headers.
  add_header Cache-Control "no-store";

    # Frontend
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 86400;
    }

    # Serve development certificates for device installation (HTTPS)
    location /certs/ {
      alias /etc/nginx/certs/;
      autoindex on;
      add_header Cache-Control "no-store";
    }

    location /vite-hmr {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # APIs
    location /api/personas/ {
      proxy_pass http://persona_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    # WS personas
    location /api/personas/ws/ {
      proxy_pass http://persona_service/ws/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }
    location /api/personas/uploads/ {
      proxy_pass http://persona_service/uploads/;
      proxy_set_header Host $host;
    }

    location /api/tipos/ {
      proxy_pass http://tipos/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/prestamos/ {
      proxy_pass http://prestamos/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    location /api/prestamos/uploads/ {
      proxy_pass http://prestamos/uploads/;
      proxy_set_header Host $host;
    }

    location /api/reportes {
      proxy_pass http://backend_root/reportes;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/compras/tipos-pago {
      proxy_pass http://compras/tipos-pago;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
    }
    location /api/compras/uploads/ {
      proxy_pass http://compras/uploads/;
      proxy_set_header Host $host;
    }
    location /api/compras {
      rewrite ^/api/compras/?$ /compras break;
      rewrite ^/api/compras/(.*)$ /compras/$1 break;
      proxy_pass http://compras;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
      proxy_set_header X-Forwarded-Proto https;
    }
    location /api/proveedores {
      rewrite ^/api/proveedores/?$ /proveedores break;
      rewrite ^/api/proveedores/(.*)$ /proveedores/$1 break;
      proxy_pass http://proveedores;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/ventas/tipos-venta {
      proxy_pass http://ventas/tipos-venta;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/ventas/tipos-pago {
      proxy_pass http://ventas/tipos-pago;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/ventas/health {
      proxy_pass http://ventas/health;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/ventas/creditos {
      proxy_pass http://ventas/ventas/creditos;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/ventas/creditos-list {
      proxy_pass http://ventas/ventas/creditos-list;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/mis-deudas {
      proxy_pass http://ventas/mis-deudas;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Ventas - main routes (rewrite /api/ventas -> /ventas)
    location /api/ventas {
      rewrite ^/api/ventas/?$ /ventas break;
      rewrite ^/api/ventas/(.*)$ /ventas/$1 break;
      proxy_pass http://ventas;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    location /api/cuentas {
      rewrite ^/api/cuentas/?$ /cuentas break;
      rewrite ^/api/cuentas/(.*)$ /cuentas/$1 break;
      proxy_pass http://cuentas;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/rutas/ {
      proxy_pass http://rutas/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    location /api/entregas/ {
      proxy_pass http://entregas/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    # WebSocket entregas
    location /api/entregas/ws/ {
      proxy_pass http://entregas/ws/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }

    # AI Predictions
    location /api/ai/ {
      proxy_pass http://ai/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    location /api/gastos/ {
      proxy_pass http://gastos/gastos/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    location /api/gastos {
      proxy_pass http://gastos/gastos;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
