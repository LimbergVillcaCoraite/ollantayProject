version: '3.8'

services:
  mysql8032:
    image: mysql:8.0.32
    restart: unless-stopped
    container_name: mysql_8_0_32-containerSources
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: P4assw@rd
      MYSQL_DATABASE: SystemaOllantay
    volumes:
      - /var/lib/mysql8032-data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ollantay_backend
    restart: unless-stopped
    depends_on:
      - mysql8032
    ports:
      - "8000:8000"
    environment:
      DATABASE_HOST: mysql8032
      DATABASE_PORT: "3306"
      DATABASE_NAME: SystemaOllantay
    volumes:
      - ./backend:/app

  tipo_persona_service:
    build:
      context: ./backend/tipo_persona_service
      dockerfile: Dockerfile
    container_name: tipo_persona_service
    restart: unless-stopped
    depends_on:
      - mysql8032
    ports:
      - "8001:8001"
    environment:
      DATABASE_HOST: mysql8032
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: P4assw@rd
      DATABASE_NAME: SystemaOllantay

  persona_service:
    build:
      context: ./backend/persona_service
      dockerfile: Dockerfile
    container_name: persona_service
    restart: unless-stopped
    depends_on:
      - mysql8032
    ports:
      - "8002:8002"
    environment:
      DATABASE_HOST: mysql8032
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: P4assw@rd
      DATABASE_NAME: SystemaOllantay

  prestamo_service:
    build:
      context: ./backend/prestamo_service
      dockerfile: Dockerfile
    container_name: prestamo_service
    restart: unless-stopped
    depends_on:
      - mysql8032
    ports:
      - "8003:8003"
    environment:
      DATABASE_HOST: mysql8032
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: P4assw@rd
      DATABASE_NAME: SystemaOllantay

  frontend:
    image: node:18-alpine
    container_name: ollantay_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm start"
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

volumes:
  mysql8032-data:
    driver: local
