version: '3.8'

services:
  mysql8032:
    image: mysql:8.0.32
    restart: unless-stopped
    container_name: mysql_8_0_32-containerSources
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: P4assw@rd
      MYSQL_DATABASE: SystemaOllantay
    volumes:
      - /var/lib/mysql8032-data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ollantay_backend
    restart: unless-stopped
    depends_on:
      - mysql8032
    ports:
      - "8000:8000"
    environment:
      DATABASE_HOST: mysql8032
      DATABASE_PORT: "3306"
      DATABASE_NAME: SystemaOllantay
    volumes:
      - ./backend:/app

  tipo_persona_service:
    build:
      context: ./backend/tipo_persona_service
      dockerfile: Dockerfile
    container_name: tipo_persona_service
    restart: unless-stopped
    depends_on:
      - mysql8032
    ports:
      - "8001:8001"
    environment:
      DATABASE_HOST: mysql8032
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: P4assw@rd
      DATABASE_NAME: SystemaOllantay
      ALLOW_ORIGIN_REGEX: 'https?://.*'

  persona_service:
    build:
      context: ./backend/persona_service
      dockerfile: Dockerfile
    container_name: persona_service
    restart: unless-stopped
    depends_on:
      - mysql8032
    ports:
      - "8002:8002"
    environment:
      DATABASE_HOST: mysql8032
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: P4assw@rd
      DATABASE_NAME: SystemaOllantay
      ALLOW_ORIGIN_REGEX: 'https?://.*'
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend/persona_service:/app
      - ./backend/persona_service/uploads:/app/uploads

  prestamo_service:
    build:
      context: ./backend/prestamo_service
      dockerfile: Dockerfile
    container_name: prestamo_service
    restart: unless-stopped
    depends_on:
      - mysql8032
    ports:
      - "8003:8003"
    environment:
      DATABASE_HOST: mysql8032
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: P4assw@rd
      DATABASE_NAME: SystemaOllantay
      ALLOW_ORIGIN_REGEX: 'https?://.*'
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend/prestamo_service:/app
      - ./backend/prestamo_service/uploads:/app/uploads

  venta_service:
    build:
      context: ./backend/venta_service
      dockerfile: Dockerfile
    container_name: venta_service
    restart: unless-stopped
    depends_on:
      - mysql8032
    ports:
      - "8004:8004"
    environment:
      DATABASE_HOST: mysql8032
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: P4assw@rd
      DATABASE_NAME: SystemaOllantay
      ALLOW_ORIGIN_REGEX: 'https?://.*'

  compra_service:
    build:
      context: ./backend/compra_service
      dockerfile: Dockerfile
    container_name: compra_service
    restart: unless-stopped
    depends_on:
      - mysql8032
    ports:
      - "8005:8005"
    environment:
      DATABASE_HOST: mysql8032
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: P4assw@rd
      DATABASE_NAME: SystemaOllantay
      ALLOW_ORIGIN_REGEX: 'https?://.*'
    volumes:
      - ./backend/compra_service/uploads:/app/uploads

  proveedores_service:
    build:
      context: ./backend/proveedores_service
      dockerfile: Dockerfile
    container_name: proveedores_service
    restart: unless-stopped
    depends_on:
      - mysql8032
    ports:
      - "8006:8006"
    environment:
      DATABASE_HOST: mysql8032
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: P4assw@rd
      DATABASE_NAME: SystemaOllantay
      ALLOW_ORIGIN_REGEX: 'https?://.*'

  cuentas_service:
    build:
      context: ./backend/cuentas_service
      dockerfile: Dockerfile
    container_name: cuentas_service
    restart: unless-stopped
    depends_on:
      - mysql8032
    ports:
      - "8007:8007"
    environment:
      DATABASE_HOST: mysql8032
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: P4assw@rd
      DATABASE_NAME: SystemaOllantay
      ALLOW_ORIGIN_REGEX: 'https?://.*'

  rutas_service:
    build:
      context: ./backend/rutas_service
      dockerfile: Dockerfile
    container_name: rutas_service
    restart: unless-stopped
    depends_on:
      - mysql8032
    ports:
      - "8008:8008"
    environment:
      DATABASE_HOST: mysql8032
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: P4assw@rd
      DATABASE_NAME: SystemaOllantay
      ALLOW_ORIGIN_REGEX: 'https?://.*'

  entregas_service:
    build:
      context: ./backend/entregas_service
      dockerfile: Dockerfile
    container_name: entregas_service
    restart: unless-stopped
    depends_on:
      - mysql8032
    ports:
      - "8009:8000"
    environment:
      DATABASE_HOST: mysql8032
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: P4assw@rd
      DATABASE_NAME: SystemaOllantay
      ALLOW_ORIGIN_REGEX: 'https?://.*'
    volumes:
      - ./backend/entregas_service:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ollantay_frontend
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

  reverse_proxy:
    image: nginx:stable-alpine
    container_name: ollantay_reverse_proxy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - persona_service
      - tipo_persona_service
      - prestamo_service
      - venta_service
      - compra_service
      - proveedores_service
      - cuentas_service
      - rutas_service
      - entregas_service
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./reverse-proxy/certs:/etc/nginx/certs:rw
      - ./reverse-proxy/letsencrypt:/etc/letsencrypt
      - ./reverse-proxy/certbot-www:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    container_name: ollantay_certbot
    depends_on:
      - reverse_proxy
    volumes:
      - ./reverse-proxy/letsencrypt:/etc/letsencrypt
      - ./reverse-proxy/certbot-www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "while true; do sleep 12h; certbot renew --webroot -w /var/www/certbot --non-interactive --agree-tos --register-unsafely-without-email || true; done"

volumes:
  mysql8032-data:
    driver: local
